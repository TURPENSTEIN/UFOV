<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indomitable UFOV</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Inter font as requested -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="instructions">Press [SPACE] to initialize the Web Audio API and start.</div>
    
    <div class="stage" id="stage">
        <div class="center-target" id="center-target"></div>
        <!-- Peripheral target injected via JS -->
    </div>
    
    <div class="noise-mask" id="mask"></div>
    
    <div class="response-overlay" id="overlay">
        <h2>Click where the peripheral target appeared</h2>
    </div>

    <script src="engine.js"></script>
</body>
</html>
